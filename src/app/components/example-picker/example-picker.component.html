<button
  #trigger
  type="button"
  class="picker-trigger"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  (click)="toggle()">
  <span class="trigger-label">{{ label() }}</span>
  <span class="caret" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</button>

<ng-template #panelTpl>
  <div class="picker-panel" role="menu" aria-label="Built-in examples">
    @for (example of examples; track example.id) {
      <button type="button" class="picker-item" role="menuitem" (click)="select(example)">
        <span class="picker-name">{{ example.name }}</span>
        <span class="picker-description">{{ example.description }}</span>
        @if (example.highlights.length) {
          <span class="picker-highlights">
            @for (highlight of example.highlights; track highlight) {
              <span class="picker-badge">{{ highlight }}</span>
            }
          </span>
        }
      </button>
    }
  </div>
</ng-template>
