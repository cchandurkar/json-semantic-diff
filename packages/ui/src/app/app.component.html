<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" (click)="onBrandClick($event)" aria-label="JSON Semantic Diff — Reset application">
      <span class="brand-mark">
        <svg class="brand-logo" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path
            class="brand-brace brand-brace-left"
            d="M5 4.5C3.8 4.5 2.8 5.4 2.8 6.5V9.5C2.8 10.8 1.8 11.5 0.5 12C1.8 12.5 2.8 13.2 2.8 14.5V17.5C2.8 18.6 3.8 19.5 5 19.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="brand-slash"
            d="M9.8 18.5L14.2 5.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            class="brand-brace brand-brace-right"
            d="M19 4.5C20.2 4.5 21.2 5.4 21.2 6.5V9.5C21.2 10.8 22.2 11.5 23.5 12C22.2 12.5 21.2 13.2 21.2 14.5V17.5C21.2 18.6 20.2 19.5 19 19.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="brand-title">
        <span class="brand-title-main">JSON</span>
        <span class="brand-title-sub">Semantic Diff</span>
      </span>
    </a>
    <nav aria-label="External links and theme">
      <a
        class="link-button"
        routerLink="/how-it-works"
        routerLinkActive="is-active"
        aria-label="How it works"
      >
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.5" />
          <path d="M8 7v4" />
          <circle cx="8" cy="4.5" r="0.75" fill="currentColor" />
        </svg>
        <span class="nav-label">How it works</span>
      </a>
      <a
        class="link-button"
        href="https://github.com/cchandurkar/json-semantic-diff"
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub repository"
      >
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
          <path
            fill-rule="evenodd"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        <span class="nav-label">GitHub</span>
      </a>
      <a
        class="link-button"
        href="https://www.npmjs.com/package/json-semantic-diff"
        target="_blank"
        rel="noreferrer"
        aria-label="npm package"
      >
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0zM5.13 5.323l13.837.019-.009 13.836h-3.464l.01-10.382h-3.456L12.04 19.17H5.113z" />
        </svg>
        <span class="nav-label">npm</span>
      </a>
      <button
        #themeTrigger
        type="button"
        class="theme-toggle"
        aria-haspopup="menu"
        [attr.aria-expanded]="themeMenuOpen()"
        (click)="toggleThemeMenu()"
        [attr.aria-label]="'Theme: ' + themeLabel()"
      >
        {{ darkMode() ? '◐' : '☀' }}
      </button>
    </nav>
  </div>
</header>

<ng-template #themeMenuTpl>
  <div class="theme-menu" role="menu" tabindex="-1" aria-label="Theme options" (keydown)="onThemeMenuKeydown($event)">
    <button
      type="button"
      class="theme-menu-item"
      role="menuitem"
      [class.is-active]="themePreference() === 'system'"
      (click)="setThemePreference('system')"
    >
      <span class="theme-item-label">System</span>
      @if (themePreference() === 'system') {
        <svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M2.5 6.5L4.5 8.5L9.5 3.5" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="theme-menu-item"
      role="menuitem"
      [class.is-active]="themePreference() === 'light'"
      (click)="setThemePreference('light')"
    >
      <span class="theme-item-label">Light</span>
      @if (themePreference() === 'light') {
        <svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M2.5 6.5L4.5 8.5L9.5 3.5" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="theme-menu-item"
      role="menuitem"
      [class.is-active]="themePreference() === 'dark'"
      (click)="setThemePreference('dark')"
    >
      <span class="theme-item-label">Dark</span>
      @if (themePreference() === 'dark') {
        <svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M2.5 6.5L4.5 8.5L9.5 3.5" />
        </svg>
      }
    </button>
  </div>
</ng-template>

<router-outlet (activate)="onRouteActivate($event)" (deactivate)="onRouteDeactivate()" />
