<button #trigger type="button" class="picker-trigger" [disabled]="disabled()" aria-haspopup="menu" [attr.aria-expanded]="open()" (click)="toggle()">
  <span class="trigger-label">{{ triggerPath() ?? placeholder() }}</span>
  <span class="caret" aria-hidden="true"
    ><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" focusable="false">
      <path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg
  ></span>
</button>

<ng-template #panelTpl>
  <div class="picker-panel" role="menu" aria-label="Arrays in this comparison">
    @for (arrayMatch of arrays(); track arrayMatch.path) {
      <button
        type="button"
        class="picker-item"
        role="menuitemradio"
        [attr.aria-checked]="isSelected(arrayMatch.path)"
        [class.is-selected]="isSelected(arrayMatch.path)"
        (click)="select(arrayMatch.path)"
      >
        <span class="picker-name">{{ arrayMatch.path }}</span>
        <span class="picker-hint">{{ describeArrayMatch(arrayMatch) }}</span>
      </button>
    }
  </div>
</ng-template>
