<section class="input-card" [class.has-error]="error()" [class.is-collapsed]="collapsed()">
  <div class="input-card__header">
    <div class="header-meta">
      <button
        type="button"
        class="file-button collapse-button"
        [attr.aria-expanded]="!collapsed()"
        [attr.aria-label]="collapsed() ? 'Expand JSON editors' : 'Collapse JSON editors'"
        [title]="collapsed() ? 'Expand editors' : 'Collapse editors'"
        (click)="requestCollapseToggle()"
      >
        <svg width="22" height="22" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
          <path
            [attr.d]="collapsed() ? 'M4 5l3 3 3-3' : 'M4 9l3-3 3 3'"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div>
        <span class="eyebrow">{{ label() }}</span>
        <span class="status" [class.valid]="isValid()" [class.error]="error()">{{ statusText() }}</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="file-button" [disabled]="!value().trim()" (click)="format()" aria-label="Format JSON" title="Format">
        <svg width="15" height="15" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <path
            d="M 0,32 v 64 h 416 v -64 z M 160,160 v 64 h 352 v -64 z M 160,288 v 64 h 288 v -64 z M 0,416 v 64 h 320 v -64 z"
            fill="currentColor"
          />
        </svg>
      </button>
      <button type="button" class="file-button" (click)="fileInput.click()" aria-label="Open file" title="Open file">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-upload"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 3v12" />
          <path d="m17 8-5-5-5 5" />
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        </svg>
      </button>
      <input #fileInput type="file" accept=".json,application/json" (change)="fileSelected($event)" hidden />
    </div>
  </div>
  @if (!collapsed()) {
    <app-code-editor
      class="json-editor"
      [value]="value()"
      (valueChange)="onEditorValue($event)"
      [darkMode]="darkMode()"
      [(editorHeight)]="editorHeight"
      [ariaLabel]="label() + ' JSON'"
      placeholder="Paste JSON here, or drop a .json file"
      (dragover)="$event.preventDefault()"
      (drop)="dropFile($event)"
    ></app-code-editor>
    @if (error()) {
      <div class="parse-error">{{ error() }}</div>
    }
  }
</section>
