    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JSON Semantic Diff",
        "url": "https://jsonsemanticdiff.dev/",
        "description": "Free online JSON diff tool that understands what changed, not just where. Compares JSON structurally, matches reordered array records by identity, and never uploads your data - everything runs locally in your browser.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Chaitanya Chandurkar",
          "url": "https://github.com/cchandurkar"
        }
      }
    </script>

    <script>
      // Applies the saved or system theme before first paint so a reload never flashes light.
      // Key must match THEME_STORAGE_KEY in src/app/shared/theme.ts.
      var savedTheme = null;
      try {
        savedTheme = localStorage.getItem('json-semantic-diff.theme');
      } catch (e) {
        /* storage blocked */
      }
      var resolvedTheme = 'light';
      if (savedTheme === 'dark' || savedTheme === 'light') {
        resolvedTheme = savedTheme;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        resolvedTheme = 'dark';
      }
      document.documentElement.dataset.theme = resolvedTheme;

      // Hides the "Take the tour" card before first paint if it's already been
      // seen, so a reload never flashes the card before Angular's own
      // afterNextRender check removes it. Angular's tourDismissed signal must
      // still start false (see sidebar.component.ts) to avoid a hydration
      // mismatch - this is a pure CSS visual override on top of that, not a
      // change to what Angular itself thinks is rendered, so it can't create a
      // mismatch. Mirrors TOUR_STORAGE_KEY/PERMANENT/DISMISS_COOLDOWN_MS in
      // src/app/shared/tour-storage.ts - change both together.
      var tourStored = null;
      try {
        tourStored = localStorage.getItem('json-semantic-diff.tourSeen');
      } catch (e) {
        /* storage blocked */
      }
      var tourSeen =
        tourStored === 'permanent' || (tourStored && Date.now() - Number(tourStored) < 14 * 24 * 60 * 60 * 1000);
      if (tourSeen) document.documentElement.dataset.tourSeen = 'true';
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script data-goatcounter="https://jsonsemanticdiff.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
