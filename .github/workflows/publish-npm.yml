name: Publish json-semantic-diff to npm

# Runs when a release is published. Releases are cut locally via
# `npm run release:core` (scripts/release.mjs), which bumps
# packages/core's version, tags it core-vX.Y.Z, and creates the GitHub
# Release with your own `gh` login - not a GitHub Actions bot token, so
# there's no loop-prevention concern blocking this listener from firing.
# workflow_dispatch is available for manual re-runs/testing.
#
# The release-triggered path only runs for core-* tagged releases, so a
# UI-only release never publishes to npm. Builds and publishes
# packages/core only - the Angular app (packages/ui) is never published to
# npm, it ships via GitHub Pages (see deploy-pages.yml).
#
# Never create a core-v* tag/release by hand - always use
# `npm run release:core`. A hand-made tag leaves package.json stale while
# the tag claims otherwise (this happened once; see git history around the
# core-v1.0.0 tag for the incident).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'core-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # If this run was triggered by a core-v* release (the normal path),
      # make sure that tag's claimed version actually matches
      # packages/core/package.json before publishing. Skipped for manual
      # workflow_dispatch re-runs against a branch, where there's no tag
      # claim to check against.
      - name: Verify tag matches packages/core version
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == core-v* ]]; then
            TAG_VERSION="${REF_NAME#core-v}"
            PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Release tag '$REF_NAME' claims version $TAG_VERSION, but packages/core/package.json is at $PKG_VERSION. This usually means the tag/release was created by hand instead of via 'npm run release:core'. Refusing to publish a mismatched version."
              exit 1
            fi
          fi

      - name: Publish (prepack builds packages/core first)
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
