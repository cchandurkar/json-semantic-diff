name: Publish json-semantic-diff to npm

# Runs when a release is published (either by "release.yml"'s explicit
# dispatch, or by a maintainer publishing a release by hand in the GitHub
# UI), plus workflow_dispatch for manual re-runs/testing. Builds and
# publishes packages/core only - the Angular app (packages/ui) is never
# published to npm, it ships via GitHub Pages (see deploy-pages.yml).
#
# The release-triggered path only runs for core-* tagged releases, so a
# UI-only release (see release.yml) never publishes to npm.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'core-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Guards against a release/tag created by hand without going through
      # release.yml's version-bump step (which keeps the tag and
      # package.json in lockstep by construction). Without this, npm publish
      # would either silently publish a stale/mismatched version or fail
      # with a confusing registry error - see AGENTS.md history for the
      # core-v1.0.0 incident that motivated this check.
      - name: Verify tag matches packages/core version
        if: github.event_name == 'release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#core-v}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' claims version $TAG_VERSION, but packages/core/package.json is at $PKG_VERSION. This usually means the tag/release was created by hand instead of via release.yml. Refusing to publish a mismatched version."
            exit 1
          fi

      - name: Publish (prepack builds packages/core first)
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
