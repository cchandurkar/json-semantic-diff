name: Release UI

# Manual only: bumps packages/ui's version, commits it, tags it as
# ui-vX.Y.Z, and publishes a GitHub Release. The "Deploy to GitHub Pages"
# workflow listens for that release and builds/publishes the app.
#
# This is independent of packages/core: releasing the UI does not bump the
# core package's version or publish a new npm release. See release-core.yml
# for that flow.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version (packages/ui only)
        id: bump
        run: |
          npm version minor -w packages/ui --no-git-tag-version --allow-same-version
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add package-lock.json packages/ui/package.json
          git commit -m "chore: release ui-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag release
        run: |
          git tag "ui-v${{ steps.bump.outputs.version }}"
          git push origin "ui-v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ui-v${{ steps.bump.outputs.version }}" \
            --title "UI v${{ steps.bump.outputs.version }}" \
            --target "${{ github.ref_name }}" \
            --generate-notes

      # A release created with the default GITHUB_TOKEN does not itself
      # trigger other workflows' `on: release` listeners (GitHub's
      # loop-prevention rule). Dispatch the Pages deployment explicitly so
      # it still happens automatically after this run.
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"
