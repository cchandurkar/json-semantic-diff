name: Deploy to GitHub Pages

# Runs when a release is published (either by "release.yml"'s explicit
# dispatch, or by a maintainer publishing a release by hand in the GitHub
# UI), plus workflow_dispatch for manual re-runs/testing.
#
# The release-triggered path only runs for ui-* tagged releases, so a
# core-only release (see release.yml) never redeploys Pages.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ui-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Guards against a release/tag created by hand without going through
      # release.yml's version-bump step (which keeps the tag and
      # package.json in lockstep by construction). See publish-npm.yml for
      # the equivalent core-package check and the incident that motivated
      # this.
      - name: Verify tag matches packages/ui version
        if: github.event_name == 'release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#ui-v}"
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' claims version $TAG_VERSION, but packages/ui/package.json is at $PKG_VERSION. This usually means the tag/release was created by hand instead of via release.yml. Refusing to deploy a mismatched version."
            exit 1
          fi

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Build UI
        working-directory: packages/ui
        # Served from the jsonsemanticdiff.dev custom domain root, not a
        # github.io/<repo> project-page subpath, so base-href must be "/".
        run: npx ng build --configuration production --base-href "/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist/json-semantic-diff-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
