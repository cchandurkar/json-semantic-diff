name: Deploy to GitHub Pages

# Runs when a release is published (either by "release-ui.yml"'s explicit
# dispatch, or by a maintainer publishing a release by hand in the GitHub
# UI), plus workflow_dispatch for manual re-runs/testing.
#
# The release-triggered path only runs for ui-* tagged releases, so a
# core-only release (see release-core.yml) never redeploys Pages.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ui-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Build UI
        working-directory: packages/ui
        # Served from the jsonsemanticdiff.dev custom domain root, not a
        # github.io/<repo> project-page subpath, so base-href must be "/".
        run: npx ng build --configuration production --base-href "/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist/json-semantic-diff-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
